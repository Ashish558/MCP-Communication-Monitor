[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-monitor"
version = "0.1.0"
description = "Intercepts MCP tool calls from Claude and asks the user to Allow or Block each one."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# System-tray icon for the background daemon (the daemon works without it).
tray = ["pystray>=0.19", "Pillow>=10"]
# HTTP gateway for Claude Web.
gateway = ["aiohttp>=3.9"]
dev = ["pytest>=8", "aiohttp>=3.9"]

[project.scripts]
mcp-monitor = "mcp_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
