<!doctype html>
<meta charset="utf-8">
<title>Mock claude.ai approval prompt (extension test page)</title>
<style>
  body { background:#1a1a1a; color:#eee; font:15px system-ui,sans-serif; padding:24px; }
  .prompt { background:#2b2b2b; border-radius:12px; padding:16px; max-width:760px; }
  .chip { background:#444; border-radius:6px; padding:1px 8px; margin:0 4px; }
  .row { background:#3a3a3a; border-radius:8px; padding:10px 14px; margin:10px 0; display:flex; gap:24px; }
  .row span:first-child { color:#aaa; }
  .buttons { display:flex; justify-content:space-between; margin-top:12px; }
  button { background:#444; color:#fff; border:0; border-radius:8px; padding:8px 14px; font:inherit; }
  kbd { background:#555; border-radius:4px; padding:0 5px; margin-left:4px; font-size:12px; }
  #result { margin-top:20px; font:600 18px Consolas,monospace; }
</style>
<div class="prompt" id="prompt">
  <div>Claude wants to use <span class="chip">get_design_context</span> from <span class="chip">Figma</span></div>
  <div class="row"><span>fileKey</span><span>LpQv6kb7I7uXudGrRuL8N5</span></div>
  <div>Get design context</div>
  <div class="buttons">
    <button id="decline">Decline <kbd>Esc</kbd></button>
    <span>
      <button id="always">Always allow <kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>⏎</kbd></button>
      <button id="once">Allow once <kbd>Ctrl</kbd><kbd>⏎</kbd></button>
    </span>
  </div>
</div>
<div id="result">RESULT: (nothing yet)</div>
<script>
  // Stand-in for the extension background worker: answers from ?v=allow|block and records what it was asked.
  window.__calls = [];
  window.chrome = { runtime: { sendMessage: async (msg) => {
    window.__calls.push(msg);
    await new Promise((r) => setTimeout(r, 300));
    const v = new URLSearchParams(location.search).get("v") || "allow";
    return v === "error" ? { decision: "block", error: "bridge down" } : { decision: v, reason: "stub" };
  } } };
  // The page's own handlers: these only run if the content script lets the click through.
  const out = (t) => { document.getElementById("result").textContent = "RESULT: " + t; };
  document.getElementById("once").addEventListener("click", () => out("ALLOWED (once)"));
  document.getElementById("always").addEventListener("click", () => out("ALLOWED (always)"));
  document.getElementById("decline").addEventListener("click", () => out("DECLINED"));
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") out("DECLINED (Esc)"); if (e.key === "Enter" && e.ctrlKey) out(e.shiftKey ? "ALLOWED (always, shortcut)" : "ALLOWED (once, shortcut)"); });
</script>
<script src="../content.js"></script>
