<!doctype html>
<meta charset="utf-8">
<title>MCP Monitor options</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input { width: 100%; padding: 8px; box-sizing: border-box; font-family: Consolas, monospace; }
  button { margin-top: 14px; padding: 8px 14px; }
  #status { margin-top: 12px; }
  .ok { color: #1e8449; } .bad { color: #c0392b; }
</style>
<h2>MCP Monitor for claude.ai</h2>
<p>Run <code>python -m mcp_monitor bridge</code> on this PC. It prints a token. Paste it here.</p>
<label for="token">Bridge token</label>
<input id="token" type="password" autocomplete="off" spellcheck="false">
<label for="port">Bridge port</label>
<input id="port" type="number" value="8766">
<button id="save">Save and test</button>
<div id="status"></div>
<script src="options.js"></script>
